name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Debug Prettier
        run: npx prettier src/pages/ExplorePage.tsx --write && git diff -- src/pages/ExplorePage.tsx

      - name: Validate
        run: npm run check
